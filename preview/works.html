<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joleen — Works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-works">
    <div class="shell">
      <header class="site-header hgy-header is-solid" id="site-header">
        <div class="header-inner hgy-header-inner">
          <a class="logo display hgy-logo" href="index.html"
            >J<span class="logo-accent">o</span>leen</a
          >
          <nav class="main-nav hgy-nav mono">
            <a href="index.html">Home</a>
            <a href="works.html" class="active">Works</a>
            <a href="resume.html">Resume</a>
          </nav>
          <a class="hgy-nav-cta mono" href="resume.html">Let's Talk ↗</a>
        </div>
      </header>

      <main class="works-main">
        <div class="wrap works-top">
          <h1 class="display works-page-title">Works.</h1>
          <div class="hgy-tab-shell mono" id="works-filters">
            <button type="button" class="active" data-filter="all">All</button>
            <button type="button" data-filter="video">Video</button>
            <button type="button" data-filter="images">Images</button>
            <button type="button" data-filter="store">Store</button>
          </div>
        </div>
        <section class="works-split" aria-label="Works gallery">
          <div class="works-split-list-wrap" id="works-038-list-wrap">
            <ul class="works-split-list display" id="works-038-list"></ul>
          </div>
          <div class="works-split-preview" id="works-038-preview"></div>
        </section>
      </main>

      <footer class="site-footer mono">© 2026 Joleen</footer>
    </div>

    <div class="modal" id="work-modal">
      <div class="modal-panel">
        <button type="button" class="modal-close" data-close-modal>×</button>
        <div id="modal-media"></div>
        <div class="modal-body">
          <h3 class="display" id="modal-title"></h3>
          <p class="mono modal-meta" id="modal-meta"></p>
          <div class="modal-grid" id="modal-fields"></div>
        </div>
      </div>
    </div>

    <script src="data/portfolio.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="gsap-effects.js"></script>
    <script>
      JoleenSite.initHeader();
      JoleenSite.initWorks();
      window.addEventListener("load", () => {
        if (window.initWorks038) initWorks038();
      });
    </script>
  </body>
</html>
